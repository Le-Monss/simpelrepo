<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2E6B"/>
      <stop offset="55%" stop-color="#0B1F3F"/>
      <stop offset="100%" stop-color="#08152B"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00E5E5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1BC8C8"/>
      <stop offset="100%" stop-color="#0B8A8A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#heroBg)"/>

  <!-- faint grid -->
  <g stroke="#1B3E73" stroke-width="1" opacity="0.5">
    <path d="M0 160 H1600 M0 320 H1600 M0 480 H1600"/>
    <path d="M266 0 V640 M533 0 V640 M800 0 V640 M1066 0 V640 M1333 0 V640"/>
  </g>

  <circle cx="950" cy="260" r="320" fill="url(#screenGlow)"/>

  <!-- desk -->
  <rect x="0" y="560" width="1600" height="80" fill="#050D1C"/>

  <!-- monitor bank -->
  <g>
    <rect x="700" y="180" width="230" height="160" rx="6" fill="#0E1A33" stroke="#1BC8C8" stroke-width="2"/>
    <rect x="712" y="192" width="206" height="118" fill="url(#screenA)" opacity="0.85"/>
    <rect x="950" y="150" width="260" height="190" rx="6" fill="#0E1A33" stroke="#F4B400" stroke-width="2"/>
    <rect x="963" y="163" width="234" height="140" fill="#12305C"/>
    <g stroke="#F4B400" stroke-width="2" opacity="0.8">
      <path d="M985 190 H1170 M985 210 H1150 M985 230 H1170 M985 250 H1120 M985 270 H1170"/>
    </g>
    <rect x="1230" y="190" width="210" height="140" rx="6" fill="#0E1A33" stroke="#1BC8C8" stroke-width="2"/>
    <rect x="1242" y="202" width="186" height="94" fill="url(#screenA)" opacity="0.7"/>
    <rect x="900" y="340" width="480" height="14" rx="4" fill="#0A162C"/>
  </g>

  <!-- person silhouette from behind, hoodie -->
  <g fill="#050B18">
    <path d="M760 640 C760 480 800 420 900 410 C1000 420 1040 480 1040 640 Z"/>
    <path d="M860 430 C860 370 930 370 935 430 C960 445 965 500 940 520 C900 540 800 540 760 520 C735 500 745 445 770 430 Z"/>
    <circle cx="900" cy="400" r="46"/>
    <path d="M854 400 a46 46 0 0 1 92 0 c0 -30 -20 -55 -46 -55 c-26 0 -46 25 -46 55 Z"/>
  </g>

  <!-- subtle text mark, kept clear of the bottom edge to avoid cropping -->
  <g fill="#FFFFFF" opacity="0.08" font-family="Poppins, sans-serif" font-weight="700" letter-spacing="2">
    <text x="1080" y="470" font-size="46">MORE THAN</text>
    <text x="1080" y="516" font-size="46">HARDWARE</text>
  </g>
</svg>
